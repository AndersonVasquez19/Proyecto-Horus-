[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2

[www]
listen = 9000
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 65s
ping.path = /fpm-ping
ping.response = pong
security.limit_extensions = .php
