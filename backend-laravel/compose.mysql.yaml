# Complemento de compose.yaml. Preparación únicamente: no ejecutar up sin autorización.
# docker compose --env-file <archivo-privado-externo> -f compose.yaml -f compose.mysql.yaml config --quiet
name: horus-laravel

services:
  app:
    environment:
      DB_HOST: mysql-laravel
      DB_PORT: "3306"
      DB_DATABASE: horus_group
    depends_on:
      mysql-laravel:
        condition: service_healthy
    networks:
      - laravel
      - mysql_privada

  mysql-laravel:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=134217728
      - --max-connections=40
      - --skip-name-resolve
      - --mysqlx=OFF
    environment:
      TZ: UTC
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # Sin MYSQL_DATABASE/MYSQL_USER ni initdb: horus_group y sus cuentas
      # se crearán explícitamente después de registrar y verificar el UUID.
    secrets:
      - mysql_root_password
    volumes:
      - mysql_datos:/var/lib/mysql
    # Sin ports, red del anfitrión, red NestJS ni red web de Laravel.
    networks:
      - mysql_privada
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)"
          mysql --protocol=socket -uroot --batch --skip-column-names
          --execute='SELECT 1' | grep -qx 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  mysql_privada:
    driver: bridge
    internal: true

volumes:
  mysql_datos:

secrets:
  mysql_root_password:
    file: ${HORUS_LARAVEL_MYSQL_ROOT_PASSWORD_FILE:?Defina la ruta absoluta de la clave root fuera del repositorio}
